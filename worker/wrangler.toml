name = "dofus-craft-community-price-api"
main = "src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "dofus-craft-community-prices"
database_id = "bfd3fab9-461c-4b72-9473-b8712bad5bc9"

# Every Monday at 03:00 UTC: removes contributions older than 90 days (worker/src/retention.ts,
# FR-013). Weekly is plenty: expired rows are already ignored at read time in between.
[triggers]
# specs/045-restore-production-worker: every other trigger reads Huzounet's prices (src/huzounet.ts), 12
# requests at most a run. FREQUENCY TO CONFIRM in the Cloudflare dashboard (Worker > Settings > Trigger
# Events) before any deploy: the production value is not readable from the deployed code (research R5).
# Seen there on 2026-10-12: « every 5 minutes, between 02:00 AM and … » (UTC, end hour not read yet);
# the value below is a placeholder until it is.
crons = ["0 3 * * MON", "*/30 * * * *"]

# At most 60 contributions per minute from one IP (worker/src/index.ts). A player filling a whole
# recipe stays far below; a script flooding the median does not.
[[ratelimits]]
name = "CONTRIBUTION_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# COMMUNITY_API_KEY is a secret, not declared here — set it with:
#   wrangler secret put COMMUNITY_API_KEY --config worker/wrangler.toml
# It must match VITE_COMMUNITY_API_KEY in the frontend's .env.local.

# specs/025-rune-purchase-import (page Forgemagie). Where the Discord login sends the player back
# (research R3). For local work, override it in worker/.dev.vars: SITE_URL=http://localhost:5173
[vars]
# "1" turns the reading of Huzounet's prices on (scheduled runs and POST /external-prices/refresh).
HUZOUNET_SYNC = "1"
SITE_URL = "https://dofus-craft.handy-apps.workers.dev"

# Forgemagie secrets, not declared here — set each one with:
#   wrangler secret put <NAME> --config worker/wrangler.toml
# and put the same values in worker/.dev.vars (not committed) for `npm run worker:dev`.
# - DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET: the Discord application used for the login (research R2)
# - DISCORD_GUILD_ID: the group's Discord server; only its members can log in (FR-002)
# - FM_BOT_API_KEY: the key the Discord bot sends with its events (contracts/fm-bot-api.md). Unlike
#   COMMUNITY_API_KEY, it never appears in the site's bundle.
